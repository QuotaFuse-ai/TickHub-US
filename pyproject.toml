[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickhub-us"
version = "1.0.0"
description = "TickHub-US (US/HK market data engine for AI agents): MCP server, th-us CLI and typed DataEnvelope"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "QuotaFuse", email = "44062290+QuotaFuse-ai@users.noreply.github.com" }]
keywords = ["us-stocks", "hk-stocks", "mcp", "mcp-server", "market-data", "sec-edgar", "options", "ai-agent"]
classifiers = [
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=2.3,<3",
  "requests>=2.31",
  "typer>=0.12",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "redis>=5.0",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
th-us = "tickhub_us.cli.main:main"

[project.urls]
Homepage = "https://github.com/QuotaFuse-ai/TickHub-US"
Documentation = "https://github.com/QuotaFuse-ai/TickHub-US#readme"
Repository = "https://github.com/QuotaFuse-ai/TickHub-US"
Issues = "https://github.com/QuotaFuse-ai/TickHub-US/issues"
Releases = "https://github.com/QuotaFuse-ai/TickHub-US/releases"
Changelog = "https://github.com/QuotaFuse-ai/TickHub-US/blob/main/docs/specs/tickhub-us.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/tickhub-us/config" = ["config/sources.yaml", "config/compliance.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: touches public endpoints (set TICKHUB_US_LIVE=1 to run)",
  "contract: interface contract tests",
  "compliance: compliance gate tests",
  "slow: slow tests",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
