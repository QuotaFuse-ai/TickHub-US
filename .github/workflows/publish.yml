name: Publish to PyPI

# 手动触发：合并代码、打 tag 都不会自动上传。
# 走 GitHub OIDC Trusted Publishing，仓库不存 token；PyPI 侧 publisher 配置为
# project tickhub-us、owner QuotaFuse-ai、repo TickHub-US、本文件、环境 pypi / testpypi。
# 步骤见 README 的 Publishing 一节。

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check the wheel runs without the source tree
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/th-us --version
          /tmp/wheelcheck/bin/th-us mcp tools > /tmp/tools.txt
          grep -q 'th_us_get_quote' /tmp/tools.txt
          /tmp/wheelcheck/bin/th-us compliance list > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to ${{ inputs.repository }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/p/tickhub-us' || 'https://test.pypi.org/p/tickhub-us' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  release:
    # 正式源上传成功后，把同一批产物挂到 GitHub Release，供离线安装。
    name: attach artifacts to GitHub Release
    needs: [build, publish]
    if: inputs.repository == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: TickHub-US ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*
