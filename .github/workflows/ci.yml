name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "同时跑联网冒烟（需要仓库变量 SEC_CONTACT，可选 secrets.POLYGON_API_KEY）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src

      - name: Test (offline)
        run: pytest -m "not live"

  live:
    # 只在手动触发且勾选 live 时运行；不参与 PR 门禁。
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test (live)
        env:
          TICKHUB_US_LIVE: "1"
          # 仓库变量：Settings → Variables → SEC_CONTACT（形如 "Zhang San zhangsan@example.com"）
          # 未配置时用例自动 skip，作业不会红。
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          # GitHub 托管 runner 在中国境外，东财 push2 常被阻断。
          TICKHUB_US_LIVE_SKIP_REGIONAL: "1"
        run: pytest tests/contract/test_live_smoke.py -m live -v
